services:
  mongo:
    image: mongo:7
    ports: ["27018:27017"]
    volumes: [mongo_data:/data/db]
  api:
    build: ./backend
    environment:
      MONGO_URL: mongodb://mongo:27017/securinets
      JWT_SECRET: change-me
      ADMIN_EMAIL: admin@securinets.tn
      ADMIN_PASSWORD: Admin123!
    depends_on: [mongo]
    ports: ["5000:5000"]
  web:
    build: ./frontend
    environment:
      API_URL: http://api:5000
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  mongo_data: